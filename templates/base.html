<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}Projeto To do List{%endblock%}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: system-ui, sans-serif;
        }
        .navbar a,
        .navbar button {
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <nav class="navbar bg-1" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">To Do List</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <button class="btn-solid fg-white" data-bs-toggle="menu" aria-expanded="false" text-white>Configurações</button>
                    <div class="menu">
                        <a class="menu-item" href="#">Logar</a>
                        <a class="menu-item" href="#">Cadastrar</a>
                        <a class="menu-item" href="#">Sair</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
